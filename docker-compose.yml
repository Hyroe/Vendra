services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-localhub}
      POSTGRES_USER: ${POSTGRES_USER:-localhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localhub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-development-key-change-me}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      DATABASE_URL: postgres://${POSTGRES_USER:-localhub}:${POSTGRES_PASSWORD:-localhub}@db:5432/${POSTGRES_DB:-localhub}
      DATABASE_CONN_MAX_AGE: ${DATABASE_CONN_MAX_AGE:-0}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: